<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekly leaderboard popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#46B8C6}a:hover{color:#7AD3DE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #05060D; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 44px 12px 12px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <div role="dialog" aria-label="Leaderboards" style="flex-grow: 1; min-height: 0; border-radius: 28px; background: #12152A; border: 1px solid #232842; display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC83A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
        <h1 style="margin: 0; flex-grow: 1; font-size: 22px; font-weight: 800">Leaderboards</h1>
        <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2236; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>
      <nav aria-label="Board type" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #0C0E1C">
        <span aria-current="page" style="flex-grow: 1; height: 40px; border-radius: 12px; background: #2A2E48; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">This week</span>
        <a href="ShapeBoard.dc.html" style="flex-grow: 1; height: 40px; border-radius: 12px; color: #A3A7C2; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">All-time</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 8px">
        <div role="tablist" aria-label="Level" style="flex-grow: 1; display: flex; gap: 4px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="flex-grow: 1; height: 34px; border-radius: 10px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800">{{t.label}}</button>
          </sc-for>
        </div>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #A3A7C2; font-weight: 700; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>2d 14h
        </span>
      </div>
    </div>

    <div style="flex-grow: 1; min-height: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 11px; font-weight: 700; color: #8E92AE; letter-spacing: .4px">
        <span style="width: 32px">#</span><span style="flex-grow: 1">PLAYER</span><span style="width: 52px; text-align: right">MOVES</span><span style="width: 60px; text-align: right">TIME</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 12px; background: {{r.bg}}">
          <div style="width: 32px"><span style="min-width: 26px; height: 26px; border-radius: 13px; background: {{r.medal}}; color: {{r.rankFg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{r.rank}}</span></div>
          <span style="flex-grow: 1; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}<span style="color: #6F7392; font-weight: 600">{{r.tag}}</span></span>
          <span style="width: 52px; text-align: right; font-size: 16px; font-weight: 800">{{r.moves}}</span>
          <span style="width: 60px; text-align: right; font-size: 13px; font-weight: 600; color: #C3C6DA">{{r.time}}</span>
        </div>
      </sc-for>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 10px; border-radius: 14px; background: #1F3A47; border: 1.5px solid #46B8C6">
        <div style="width: 32px"><span style="font-weight: 800; font-size: 14px; color: #46B8C6">{{me.rank}}</span></div>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 800">You · Tuan_Pro<span style="color: #8FB8C2; font-weight: 600">#4821</span></span>
        <span style="width: 52px; text-align: right; font-size: 16px; font-weight: 800">{{me.moves}}</span>
        <span style="width: 60px; text-align: right; font-size: 13px; font-weight: 600; color: #D5E6EA">{{me.time}}</span>
      </div>
    </div>

    <div role="tablist" aria-label="Shape" style="margin-top: 12px; padding: 10px 8px 12px; background: #0C0E1C; border-top: 1px solid #232842; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{dock}}" as="d" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{d.on}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="height: 62px; border: 0; padding: 0; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; opacity: {{d.opacity}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
          <span style="font-size: 10.5px; font-weight: 800; white-space: nowrap">{{d.name}}</span>
          <sc-if value="{{d.locked}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 4px; right: 6px; width: 16px; height: 16px; border-radius: 8px; background: #2A2E48; display: flex; align-items: center; justify-content: center">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#C3C6DA" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'L2', shape: 'cube' }; }
renderVals() {
const tab = this.state.tab, shape = this.state.shape;
const ICONS = {
cube: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
tetra: 'M12 3L3 19h18zM12 3l-1.5 16M3 19l7.5-4.5L21 19',
octa: 'M12 2l7 10-7 10-7-10zM5 12h14M12 2l-2 10 2 10',
sphere: 'M12 5a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM2 12.5c0-2 4.5-3.5 10-3.5s10 1.5 10 3.5-4.5 3.5-10 3.5S2 14.5 2 12.5',
dodeca: 'M12 3l8.5 6.2-3.2 10H6.7L3.5 9.2zM12 7.5l4.3 3.1-1.6 5H9.3l-1.6-5z',
megamix: 'M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z'
};
const shapes = [['cube', 'Moonbase', false], ['tetra', 'Pyramid', false], ['octa', 'Star Gem', true], ['sphere', 'Planet', true], ['dodeca', 'Galaxy', true], ['megamix', 'Nebula', true]];
const dock = shapes.map(([id, name, locked]) => ({ name, icon: ICONS[id], locked, aria: locked ? name + ', locked' : name, on: id === shape ? 'true' : 'false', bg: id === shape ? '#46B8C6' : 'transparent', fg: id === shape ? '#0A0C18' : '#C3C6DA', opacity: locked ? '0.45' : '1', pick: () => { if (!locked) this.setState({ shape: id }); } }));
const tabs = ['Total', 'L1', 'L2', 'L3'].map((l) => ({ label: l, on: l === tab ? 'true' : 'false', bg: l === tab ? '#1F3A47' : 'transparent', fg: l === tab ? '#FFFFFF' : '#A3A7C2', border: l === tab ? '#46B8C6' : '#232842', pick: () => this.setState({ tab: l }) }));
const names = [['LinhNeon', '#0193'], ['Khoa.dev', '#7720'], ['mai_cube', '#3304'], ['Volt', '#5561'], ['PhucTran', '#1288'], ['Sparky', '#9047'], ['an_an', '#2210']];
const k = shapes.findIndex((x) => x[0] === shape);
const base = tab === 'Total' ? { m: 61 + k * 9, t: 1450 + k * 300 } : { m: 21 + k * 3, t: 312 + k * 60 };
const fmt = (t) => { const s = Math.floor(t / 10); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '.' + (t % 10); };
const rows = names.map((n, i) => ({ rank: i + 1, name: n[0], tag: n[1], moves: base.m + (i < 3 ? 0 : i < 5 ? 1 : 2), time: fmt(base.t + i * (tab === 'Total' ? 260 : 37)), medal: ['#FFC83A', '#C9CEDD', '#D98E5A'][i] || 'transparent', rankFg: i < 3 ? '#0A0C18' : '#C3C6DA', bg: i < 3 ? '#191D35' : 'transparent' }));
const me = tab === 'Total' ? { rank: '–', moves: '–', time: 'solve all 3' } : { rank: '#19', moves: base.m + 6, time: fmt(base.t + 410) };
return { tabs, rows, me, dock };
}
}
</script>
</body>
</html>
