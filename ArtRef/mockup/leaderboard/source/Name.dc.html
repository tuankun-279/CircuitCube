<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard name</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#46B8C6}a:hover{color:#7AD3DE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #05060D; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="padding: 10px 24px 32px; border-radius: 28px 28px 0 0; background: #161828; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #33385A"></div>
    <h2 style="margin: 4px 0 0; font-size: 24px; font-weight: 800">Your name on the boards</h2>
    <p style="margin: 0; font-size: 14px; color: #A3A7C2; font-weight: 500; line-height: 1.45">Shown next to your scores. Letters, numbers and _ only, up to 20. A #tag is added so names stay unique.</p>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="lb-name" style="font-size: 13px; font-weight: 700; color: #C3C6DA">Name</label>
      <div style="display: flex; align-items: center; height: 54px; padding: 0 16px; border-radius: 16px; background: #0F1120; border: 1.5px solid #46B8C6">
        <input id="lb-name" value="Tuan_Pro" maxlength="20" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700">
        <span style="font-size: 16px; color: #6F7392; font-weight: 600">#4821</span>
      </div>
      <span style="font-size: 12px; color: #8E92AE; font-weight: 600">8 / 20</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #1E2236">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#46B8C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="font-size: 13px; color: #C3C6DA; font-weight: 600; line-height: 1.4">Signed in with Google Play Games. Your rank follows you to a new phone.</span>
    </div>

    <button style="height: 56px; border: 0; border-radius: 20px; background: #46B8C6; color: #0A0C18; font-family: inherit; font-size: 19px; font-weight: 700">Save</button>
    <button style="height: 48px; border: 0; border-radius: 18px; background: transparent; color: #C3C6DA; font-family: inherit; font-size: 16px; font-weight: 700">Not now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
